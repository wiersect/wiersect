<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Wies (@wiersect) — Cryptography &amp; Systems Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b101b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)"/>
  <rect width="900" height="230" rx="14" fill="url(#grid)"/>
  <rect width="900" height="230" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="228.5" rx="13.25" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>
  <rect x="36" y="34" width="4" height="162" rx="2" fill="url(#accent)"/>

  <!-- Right-side cryptographic lattice & sponge permutation motif -->
  <g transform="translate(650, 26)" opacity="0.92">
    <!-- Outer hexagonal lattice ring -->
    <polygon points="105,14 182,58 182,126 105,170 28,126 28,58" fill="none" stroke="#475569" stroke-opacity="0.55" stroke-width="1.2"/>
    <polygon points="105,36 162,69 162,115 105,148 48,115 48,69" fill="none" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- Internal cross-word ARX / sponge edges -->
    <line x1="105" y1="14" x2="105" y2="170" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="28" y1="58" x2="182" y2="126" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="182" y1="58" x2="28" y2="126" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="48" y1="69" x2="162" y2="69" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="48" y1="115" x2="162" y2="115" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
    <!-- 6 state-word vertices (WilisPerm-384: 6 x 64-bit) -->
    <circle cx="105" cy="14" r="4" fill="#38bdf8"/>
    <circle cx="182" cy="58" r="4" fill="#8b5cf6"/>
    <circle cx="182" cy="126" r="4" fill="#6366f1"/>
    <circle cx="105" cy="170" r="4" fill="#38bdf8"/>
    <circle cx="28" cy="126" r="4" fill="#8b5cf6"/>
    <circle cx="28" cy="58" r="4" fill="#6366f1"/>
    <!-- Center core badge -->
    <circle cx="105" cy="92" r="24" fill="#0f172a" stroke="url(#accent)" stroke-width="1.8"/>
    <text x="105" y="89" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">384b</text>
    <text x="105" y="102" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="0.8">STATE</text>
  </g>

  <!-- Left-side identity & copy -->
  <text x="58" y="54" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.6">// CRYPTOGRAPHY · SYSTEMS ENGINEERING · RUST</text>

  <text x="58" y="103" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">Wies</text>
  <text x="160" y="103" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">@wiersect</text>

  <text x="58" y="135" fill="#cbd5e1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">Building zero-dependency post-quantum &amp; symmetric cryptographic</text>
  <text x="58" y="157" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">software from first principles in pure Rust.</text>

  <!-- Clean monospace pill tags -->
  <g transform="translate(58, 174)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="96" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="48" y="16.5" text-anchor="middle" fill="#38bdf8">Pure Rust</text>

    <rect x="106" y="0" width="122" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="167" y="16.5" text-anchor="middle" fill="#c4b5fd">Post-Quantum</text>

    <rect x="238" y="0" width="122" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="299" y="16.5" text-anchor="middle" fill="#a5b4fc">Constant-Time</text>

    <rect x="370" y="0" width="128" height="25" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="434" y="16.5" text-anchor="middle" fill="#6ee7b7">0 External Deps</text>
  </g>
</svg>
