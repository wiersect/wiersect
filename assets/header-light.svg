<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Wies (@wiersect) — Cryptography &amp; Systems Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.11"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="230" rx="14" fill="url(#bg)"/>
  <rect width="900" height="230" rx="14" fill="url(#grid)"/>
  <rect width="900" height="230" rx="14" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="898.5" height="228.5" rx="13.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="36" y="34" width="4" height="162" rx="2" fill="url(#accent)"/>

  <!-- Right-side cryptographic lattice & sponge permutation motif -->
  <g transform="translate(650, 26)" opacity="0.95">
    <polygon points="105,14 182,58 182,126 105,170 28,126 28,58" fill="none" stroke="#94a3b8" stroke-opacity="0.7" stroke-width="1.2"/>
    <polygon points="105,36 162,69 162,115 105,148 48,115 48,69" fill="none" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="105" y1="14" x2="105" y2="170" stroke="#0284c7" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="28" y1="58" x2="182" y2="126" stroke="#6d28d9" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="182" y1="58" x2="28" y2="126" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="48" y1="69" x2="162" y2="69" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="48" y1="115" x2="162" y2="115" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="105" cy="14" r="4" fill="#0284c7"/>
    <circle cx="182" cy="58" r="4" fill="#6d28d9"/>
    <circle cx="182" cy="126" r="4" fill="#4f46e5"/>
    <circle cx="105" cy="170" r="4" fill="#0284c7"/>
    <circle cx="28" cy="126" r="4" fill="#6d28d9"/>
    <circle cx="28" cy="58" r="4" fill="#4f46e5"/>
    <circle cx="105" cy="92" r="24" fill="#ffffff" stroke="url(#accent)" stroke-width="1.8"/>
    <text x="105" y="89" text-anchor="middle" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">384b</text>
    <text x="105" y="102" text-anchor="middle" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="0.8">STATE</text>
  </g>

  <!-- Left-side identity & copy -->
  <text x="58" y="54" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.6">// OFFENSIVE SECURITY · CRYPTOGRAPHY · DEVELOPER</text>

  <text x="58" y="103" fill="#0f172a" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">Wies</text>
  <text x="160" y="103" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="500">@wiersect</text>

  <text x="58" y="135" fill="#1e293b" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Penetration testing, offensive security research &amp; systems development —</text>
  <text x="58" y="157" fill="#475569" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">breaking assumptions and building zero-dependency Rust security tools.</text>

  <!-- Clean monospace pill tags -->
  <g transform="translate(58, 174)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="150" height="25" rx="6" fill="#ffe4e6" stroke="#fecdd3" stroke-width="1"/>
    <text x="75" y="16.5" text-anchor="middle" fill="#be123c">Penetration Testing</text>

    <rect x="160" y="0" width="128" height="25" rx="6" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1"/>
    <text x="224" y="16.5" text-anchor="middle" fill="#6d28d9">Security Audit</text>

    <rect x="298" y="0" width="114" height="25" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="355" y="16.5" text-anchor="middle" fill="#0369a1">Cryptography</text>

    <rect x="422" y="0" width="136" height="25" rx="6" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="490" y="16.5" text-anchor="middle" fill="#047857">Systems / Rust</text>
