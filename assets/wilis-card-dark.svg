<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Flagship Project: wiersect/wilis — Standalone Post-Quantum &amp; Symmetric Cryptography Suite">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#131927"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="190" rx="12" fill="url(#cardBg)"/>
  <rect x="0.75" y="0.75" width="898.5" height="188.5" rx="11.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="3.5" rx="2" fill="url(#topBar)"/>

  <!-- Header line -->
  <circle cx="34" cy="40" r="6" fill="#8b5cf6"/>
  <text x="50" y="45" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">wiersect / wilis</text>

  <!-- Right status pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">
    <rect x="650" y="27" width="70" height="23" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
    <text x="685" y="42" text-anchor="middle" fill="#ddd6fe">v0.5.0</text>

    <rect x="728" y="27" width="144" height="23" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="800" y="42" text-anchor="middle" fill="#a7f3d0">0 External Crates</text>
  </g>

  <!-- Description -->
  <text x="28" y="76" fill="#c9d1d9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5">Standalone Post-Quantum &amp; Symmetric Cryptography Suite built from scratch on WilisPerm-384.</text>
  <text x="28" y="97" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">AEAD · Module-LWE KEM (IND-CCA2) · WOTS+ Merkle Signatures · Forward-Secret Ratchet · 16–64 MiB KDF · Shamir · Vault · C/Python FFI</text>

  <!-- 4 Metric Sub-Cards -->
  <g transform="translate(28, 116)">
    <rect x="0" y="0" width="201" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6">CORE PERMUTATION</text>
    <text x="14" y="41" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">WilisPerm-384 (Rd 2)</text>

    <rect x="214" y="0" width="201" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="228" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6">POST-QUANTUM</text>
    <text x="228" y="41" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">MLWE-768 · WOTS+</text>

    <rect x="428" y="0" width="201" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="442" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6">VERIFICATION</text>
    <text x="442" y="41" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">48/48 · KAT · 7-Audit</text>

    <rect x="642" y="0" width="202" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="656" y="22" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.6">CROSS-PLATFORM</text>
    <text x="656" y="41" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Linux · macOS · Win</text>
